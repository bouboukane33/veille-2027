name: Collecte CCR Veille
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
permissions:
  contents: read
concurrency:
  group: ccr-veille-live
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Restaurer, collecter et publier les données réelles
        run: python scripts/run_cloud_pipeline.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Conserver les exports Power BI et journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ccr-veille-exports
          path: |
            data/exports/live/
            logs/pipeline.log
          if-no-files-found: ignore
          retention-days: 14
